  </defs>
  <rect width="1600" height="460" rx="24" fill="url(#surface)"/>
  <rect x="80" y="75" width="10" height="310" rx="5" fill="url(#accent)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
