<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">MSFlix Business Control</title>
  <desc id="desc">A dark cinematic banner with coral accents for the MSFlix entertainment operations platform.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121315"/>
      <stop offset="0.65" stop-color="#1B1C1F"/>
      <stop offset="1" stop-color="#332322"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F39489"/>
      <stop offset="1" stop-color="#ED6757"/>
