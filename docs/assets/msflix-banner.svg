    <text x="120" y="257" font-size="105" font-weight="750" letter-spacing="-5"><tspan fill="#F1F0EE">MS</tspan><tspan fill="#ED6757">FLIX</tspan></text>
    <text x="125" y="315" fill="#B2B1B5" font-size="31" font-weight="400" letter-spacing="1">BUSINESS CONTROL</text>
    <text x="125" y="374" fill="#B2B1B5" font-size="18">Real transactions. Shared business context. One operating picture.</text>
  </g>
